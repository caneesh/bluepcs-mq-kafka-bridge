# Production Environment Profile
# Generated from Talend property file: prod_product_bluepcs_mq_listener_talend_param.prm
#
# MANDATORY ENVIRONMENT VARIABLES - Deployment team must set:
# - KAFKA_TRUSTSTORE_PASSWORD: Kafka SSL truststore password
# - OAUTH_CLIENT_ID: OAuth2 client id (uv_clientID - secret, no default here)
# - OAUTH_CLIENT_SECRET: OAuth2 client secret for API authentication
# - API_PASSWORD: Marketing Plan API password
# - HDFS_KERBEROS_KEYTAB: Path to Kerberos keytab (if different from default)
#
# OPTIONAL:
# - MQ_PASSWORD: set only if the queue manager requires MQCSP password auth.
#   The prod .prm carries uv_MQ_Password, so the prod QM likely DOES require
#   it - expect to set this (unlike test)

bridge:
  # ============================================================================
  # IBM MQ Configuration
  # Source: cv_MQ_* properties from Talend
  # ============================================================================
  mq:
    host: ${MQ_HOST:pwausxhdapp02.app.hcscint.net}
    port: ${MQ_PORT:3112}
    queue-manager: ${MQ_QUEUE_MANAGER:MQHDPP2}
    channel: ${MQ_CHANNEL:DDA.APP.SVRCONN}
    queue: ${MQ_QUEUE:GRP.BPCS.MULE2DDA.PROD.SUBQ}
    username: ${MQ_USERNAME:hdpapp}
    # set MQ_PASSWORD only if the queue manager requires MQCSP auth
    password: ${MQ_PASSWORD:}
    # Go-live gate: prod refuses to start with the listener disabled (a healthy-looking
    # app that consumes nothing). The 24/7 launchers (systemd unit, bridge-keepalive.sh)
    # pass --bridge.mq.listener-enabled=true; a deliberate safe-start must pass
    # --bridge.mq.require-listener-enabled=false. Diagnostic modes (validate-only,
    # component-test, monitor) are exempt automatically.
    require-listener-enabled: ${REQUIRE_LISTENER_ENABLED:true}
    # Must stay at 1: the HDFS exists-check/write/rename sequence is not atomic, so
    # concurrent listeners can race on the same message and produce duplicate Kafka events
    concurrency: 1
    receive-timeout: 10000
    # SSL configuration (if enabled)
    ssl:
      enabled: ${MQ_SSL_ENABLED:false}
      cipher-suite: ${MQ_SSL_CIPHER_SUITE:}
      truststore-location: ${MQ_SSL_TRUSTSTORE_LOCATION:}
      truststore-password: ${MQ_SSL_TRUSTSTORE_PASSWORD:}

  # ============================================================================
  # Kafka Configuration
  # Source: cv_kfk_* properties from Talend
  # ============================================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:pwauslclkap02.app.hcscint.net:9093,pwauslclkap03.app.hcscint.net:9093,pwauslclkap04.app.hcscint.net:9093,pwauslclkap05.app.hcscint.net:9093,paznslclkap03.app.hcscint.net:9093,paznslclkap04.app.hcscint.net:9093,paznslclkap05.app.hcscint.net:9093,paznslclkap06.app.hcscint.net:9093,pazsslclkap01.app.hcscint.net:9093,pazsslclkap02.app.hcscint.net:9093,pazsslclkap03.app.hcscint.net:9093,pazsslclkap04.app.hcscint.net:9093}
    topic: ${KAFKA_TOPIC:DAS_PRODUCT_PMM_PRODUCT_GOLD}
    # Audit topic is bridge-specific (not in the Talend .prm) - name follows the
    # DAS_ convention of the main topic; confirm with the Kafka team at creation
    audit-topic: ${KAFKA_AUDIT_TOPIC:DAS_PRODUCT_BRIDGE_AUDIT}
    security-protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
    sasl-mechanism: ${KAFKA_SASL_MECHANISM:GSSAPI}
    sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
    jaas-config-path: ${KAFKA_JAAS_CONFIG_PATH:/datalakedata/prod/gold/integration/conf/product/common/prod_kafka_jaas_confluent.conf}
    kerberos-service-name: ${KAFKA_KERBEROS_SERVICE_NAME:cp-kafka}
    # SSL/TLS settings
    truststore-location: ${KAFKA_TRUSTSTORE_LOCATION:/datalakedata/prod/gold/integration/conf/product/confluent_kafka/kafka.truststore-prod_2025.jks}
    truststore-password: ${KAFKA_TRUSTSTORE_PASSWORD}
    truststore-type: ${KAFKA_TRUSTSTORE_TYPE:JKS}
    keystore-location: ${KAFKA_KEYSTORE_LOCATION:}
    keystore-password: ${KAFKA_KEYSTORE_PASSWORD:}
    key-password: ${KAFKA_KEY_PASSWORD:}
    # Producer settings
    request-size: ${KAFKA_REQUEST_SIZE:8388608}
    delivery-timeout-ms: 120000
    request-timeout-ms: 30000
    max-block-ms: 60000
    acks: all

  # ============================================================================
  # HDFS Configuration
  # Source: cv_hfsx_* properties from Talend
  # ============================================================================
  hdfs:
    # PRDODPHA is the prod HA nameservice (cv_hdfs_nameservices, NOT a DNS name);
    # the NameNode pair behind it (pwausl4slmn04/05:8020) is resolved from the
    # hdfs-site.xml under HADOOP_CONF_DIR
    namenode: ${HDFS_NAMENODE:hdfs://PRDODPHA}
    base-path: ${HDFS_BASE_PATH:/prod/work/product/bluepcs/hive/raw}
    archive-path: ${HDFS_ARCHIVE_PATH:/prod/work/product/bluepcs/hive/raw/archive}
    replication: ${HDFS_REPLICATION:3}
    temp-suffix: .tmp
    # Kerberos authentication
    kerberos:
      enabled: ${HDFS_KERBEROS_ENABLED:true}
      principal: ${HDFS_KERBEROS_PRINCIPAL:a6193139@ADHCSCINT.NET}
      keytab: ${HDFS_KERBEROS_KEYTAB:/etc/security/keytabs/a6193139.keytab}
      namenode-principal: ${HDFS_NAMENODE_PRINCIPAL:nn/_HOST@ADHCSCINT.NET}
      resourcemanager-principal: ${HDFS_RESOURCEMANAGER_PRINCIPAL:rm/_HOST@ADHCSCINT.NET}

  # ============================================================================
  # HBase Configuration (opt-in via 'hbase' profile)
  # Source: cv_hv_* properties from Talend
  # ============================================================================
  hbase:
    zookeeper-quorum: ${HBASE_ZOOKEEPER_QUORUM:pwausl4slmn01.app.hcscint.net,pwausl4slmn02.app.hcscint.net,pwausl4slmn03.app.hcscint.net}
    zookeeper-port: ${HBASE_ZOOKEEPER_PORT:2181}
    znode-parent: ${HBASE_ZNODE_PARENT:/hbase}
    ledger-table: ${HBASE_LEDGER_TABLE:bridge_ledger}

  # ============================================================================
  # Marketing Plan API Configuration
  # Source: cv_planitfeb_api_url, cv_security_token_* from Talend
  # ============================================================================
  api:
    base-url: ${API_BASE_URL:https://api-gateway-ssl-svc.hcscint.net/eps_product_catalog/v2/plans}
    timeout-seconds: ${API_TIMEOUT_SECONDS:30}
    retry-attempts: ${API_RETRY_ATTEMPTS:3}
    retry-delay-ms: ${API_RETRY_DELAY_MS:1000}

  # ============================================================================
  # OAuth2 Security Configuration
  # Source: cv_security_token_*, cv_clientSecret, cv_serviceaccount from Talend
  # ============================================================================
  security:
    token-url: ${OAUTH_TOKEN_URL:https://p-sso-sg-prd-svc.hcscint.net/sts/v5/jwt_clientcred_token_internal}
    # uv_clientID is redacted in the .prm - a secret with no default, like the client secret
    client-id: ${OAUTH_CLIENT_ID}
    client-secret: ${OAUTH_CLIENT_SECRET}
    scope: ${OAUTH_SCOPE:openid permissions profile}
    username: ${API_USERNAME:a6193139}
    password: ${API_PASSWORD:}

  # ============================================================================
  # Audit and Logging Configuration
  # Source: cv_Hive_Audit_tblname, cv_log_file_dir from Talend
  # ============================================================================
  audit:
    hive-table: ${AUDIT_HIVE_TABLE:bluepcs_mq_listener}
    enabled: true
    # kafka = publish to bridge.kafka.audit-topic; log = write JSON lines to the 'audit'
    # logger instead (bring-up fallback while the audit topic does not exist yet)
    publisher: ${AUDIT_PUBLISHER:kafka}

  logging:
    directory: ${LOG_DIRECTORY:/datalakedata/prod/gold/integration/logs/product/bluepcs/talend}

  # ============================================================================
  # Recovery Configuration
  # ============================================================================
  recovery:
    enabled: false
    max-retries: 5
    interval-ms: 120000

  # ============================================================================
  # Reconciliation Configuration (requires LedgerRepository - disabled for MVP)
  # ============================================================================
  reconciliation:
    enabled: false

# NOTE: no spring.kafka block here. The custom KafkaConfiguration beans (bridge.kafka.*)
# replace Spring Boot's auto-configured KafkaTemplate in all !local profiles, so a
# parallel spring.kafka block is inert and silently drifts from the authoritative config.

# ============================================================================
# Hadoop Configuration
# ============================================================================
hadoop:
  conf-dir: ${HADOOP_CONF_DIR:/etc/hadoop/conf}

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level:
    com.hcsc.bridge: INFO
    org.apache.kafka: WARN
    org.apache.hadoop: WARN
    org.apache.hbase: WARN
    com.ibm.mq: WARN
  file:
    name: ${LOG_DIRECTORY:/datalakedata/prod/gold/integration/logs/product/bluepcs/talend}/bridge-application.log

# ============================================================================
# Actuator Configuration
# ============================================================================
management:
  endpoint:
    health:
      # MUST be 'always': the endpoint is localhost-only in this deployment, and the
      # Control-M monitor needs the mqListener details to verify the bridge is actually
      # consuming. 'when_authorized' without Spring Security on the classpath hides
      # details from EVERYONE, silently blinding the monitor's not-consuming check.
      show-details: always
      # Liveness group for the process supervisors (watchdog/keepalive): a restart must
      # trigger only when the BRIDGE process is wedged (mqListener DOWN), not when a
      # downstream dependency (Kafka/HDFS) has an outage — restarting a healthy JVM
      # every cycle during a broker incident is pure churn and destroys the diagnostic
      # signal. Humans and the Control-M monitor keep using the full aggregate endpoint.
      group:
        liveness:
          include: mqListener,ping
          show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics
