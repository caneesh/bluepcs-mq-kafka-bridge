# MQ-Kafka Bridge Application Configuration
# Common settings - profile-specific overrides in application-{profile}.yml

spring:
  application:
    name: mq-kafka-bridge
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # LOCAL PROFILE ONLY: feeds Spring Boot's auto-configured KafkaTemplate, which the
  # local profile relies on (the custom KafkaConfiguration beans are @Profile("!local")
  # and replace the auto-config everywhere else, making this block inert there).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

bridge:
  # Kafka Configuration
  kafka:
    topic: ${KAFKA_TOPIC:bridge-events}
    audit-topic: ${KAFKA_AUDIT_TOPIC:bridge-audit}
    # Must cover the producer's full send budget (max-block-ms + delivery-timeout-ms) so
    # the synchronous wait cannot expire while the record is still in flight — a premature
    # timeout reports failure for a record that is usually still delivered, and the MQ
    # redelivery then produces a guaranteed duplicate.
    timeout-seconds: ${KAFKA_TIMEOUT_SECONDS:190}
    audit-timeout-seconds: ${KAFKA_AUDIT_TIMEOUT_SECONDS:5}
    delivery-timeout-ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}
    request-timeout-ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
    max-block-ms: ${KAFKA_MAX_BLOCK_MS:60000}
    # Security — FLAT keys: this is the shape BridgeProperties/KafkaConfiguration and
    # StartupConfigValidator actually bind (nested bridge.kafka.security.*/sasl.*/ssl.*
    # keys bind to NOTHING and previously sat here as dead config). Env var names match
    # the prod/test-env profiles and templates. Defaults align with BridgeProperties so
    # the validator and the runtime can never disagree on the effective protocol.
    security-protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
    sasl-mechanism: ${KAFKA_SASL_MECHANISM:GSSAPI}
    sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
    jaas-config-path: ${KAFKA_JAAS_CONFIG_PATH:}
    kerberos-service-name: ${KAFKA_KERBEROS_SERVICE_NAME:kafka}
    truststore-location: ${KAFKA_TRUSTSTORE_LOCATION:}
    truststore-password: ${KAFKA_TRUSTSTORE_PASSWORD:}
    truststore-type: ${KAFKA_TRUSTSTORE_TYPE:JKS}
    keystore-location: ${KAFKA_KEYSTORE_LOCATION:}
    keystore-password: ${KAFKA_KEYSTORE_PASSWORD:}
    key-password: ${KAFKA_KEY_PASSWORD:}

  # HDFS Configuration
  hdfs:
    base-path: ${HDFS_BASE_PATH:/data/bridge/payloads}
    # Quarantine dir for unparseable messages; empty = <base-path>/errors
    error-path: ${HDFS_ERROR_PATH:}
    temp-suffix: .tmp
    replication: ${HDFS_REPLICATION:3}
    namenode: ${HDFS_NAMENODE:hdfs://localhost:9000}
    local-base-path: ${HDFS_LOCAL_BASE_PATH:./data/hdfs}
    config-dir: ${HADOOP_CONF_DIR:}
    kerberos:
      enabled: ${HDFS_KERBEROS_ENABLED:false}
      principal: ${HDFS_KERBEROS_PRINCIPAL:}
      keytab: ${HDFS_KERBEROS_KEYTAB:}

  # HBase Ledger Configuration
  hbase:
    zookeeper-quorum: ${HBASE_ZOOKEEPER_QUORUM:localhost}
    zookeeper-port: ${HBASE_ZOOKEEPER_PORT:2181}
    znode-parent: ${HBASE_ZNODE_PARENT:/hbase}
    ledger-table: ${HBASE_LEDGER_TABLE:bridge_ledger}

  # Ledger file storage (legacy/file-ledger profile only)
  ledger:
    storage-path: ${LEDGER_PATH:/data/bridge/ledger}

  # REST API Configuration
  api:
    base-url: ${API_BASE_URL:http://localhost:8080}
    timeout-seconds: ${API_TIMEOUT_SECONDS:30}

  # OAuth2/JWT Security - must be provided by deployment team
  security:
    token-url: ${OAUTH_TOKEN_URL:}
    client-id: ${OAUTH_CLIENT_ID:}
    client-secret: ${OAUTH_CLIENT_SECRET:}
    scope: ${OAUTH_SCOPE:}
    username: ${API_USERNAME:}
    password: ${API_PASSWORD:}

  # IBM MQ Configuration - must be provided by deployment team
  mq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:1414}
    queue-manager: ${MQ_QUEUE_MANAGER:QM1}
    channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
    queue: ${MQ_QUEUE:BRIDGE.INPUT.QUEUE}
    username: ${MQ_USERNAME:}
    password: ${MQ_PASSWORD:}
    concurrency: ${MQ_CONCURRENCY:1}
    receive-timeout: ${MQ_RECEIVE_TIMEOUT:5000}
    log-payload: ${MQ_LOG_PAYLOAD:false}
    # Poison-message guard: quarantine to HDFS + audit + ack after this many delivery attempts.
    # 0 = disabled; prefer queue-manager backout (BOTHRESH/BOQNAME) which preserves the message.
    max-delivery-attempts: ${MQ_MAX_DELIVERY_ATTEMPTS:0}
    # Redelivery throttle: sleep (deliveryCount-1) * backoff-ms (capped) before reprocessing a
    # redelivered message, so a persistently failing message cannot spin at broker speed and
    # flood logs/the audit topic. 0 disables.
    redelivery-backoff-ms: ${MQ_REDELIVERY_BACKOFF_MS:1000}
    redelivery-backoff-max-ms: ${MQ_REDELIVERY_BACKOFF_MAX_MS:30000}
    ssl:
      cipher-suite: ${MQ_SSL_CIPHER_SUITE:}
      truststore-location: ${MQ_SSL_TRUSTSTORE_LOCATION:}
      truststore-password: ${MQ_SSL_TRUSTSTORE_PASSWORD:}

  # Recovery Configuration
  recovery:
    enabled: ${RECOVERY_ENABLED:false}
    max-retries: ${RECOVERY_MAX_RETRIES:3}
    interval-ms: ${RECOVERY_INTERVAL_MS:60000}

  # Reconciliation Configuration (requires LedgerRepository)
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:false}

  # Monitor Mode (read-only checks for Control-M / external schedulers; scripts/monitor.sh)
  monitor:
    enabled: ${MONITOR_ENABLED:false}
    health-url: ${MONITOR_HEALTH_URL:http://localhost:8080/actuator/health}
    backlog-age-minutes: ${MONITOR_BACKLOG_AGE_MINUTES:30}
    backlog-max-files: ${MONITOR_BACKLOG_MAX_FILES:0}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    com.hcsc.bridge: ${LOG_LEVEL:INFO}
    org.apache.kafka: WARN
    org.apache.hadoop: WARN
    org.apache.hbase: WARN
